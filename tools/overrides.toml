# overrides.toml — project-specific prose overrides.
#
# Copy this file to the parent tools/ directory:
#   cp tools/docgen/overrides.toml.example tools/overrides.toml
#
# tools/overrides.toml is gitignored — never commit it.
#
# Keys match the header path relative to include/, without extension,
# using forward slashes. Example:
#   "vision/implementation/detection/obstacle_detector"
#
# Within each section:
#   __overview__           = overview paragraph (Markdown)
#   __constructor__        = constructor description
#   method_name            = description for that method
#   method_name.param_name = description for a specific parameter
#
# Methods already handled by naming conventions (get_*/set_*,
# on_setup, on_teardown, on_update, setup, teardown, …) do NOT
# need entries here unless you want to override the generated text.
#
# Namespace overviews can be provided under:
#
[__namespaces__]
core = "The `acs::core` namespace defines the base object model for ACS. It provides `i_object` for shared identity (a debug-facing tag/name) and `i_threaded_object` for managed periodic execution in derived objects."
gui = "The `acs::gui` namespace contains GUI objects and interfaces used to host windows, register widgets, and render runtime visualization views."
opengl = "The `acs::opengl` namespace contains OpenGL-focused rendering objects and helpers used by the visualization stack."
utility = "The `acs::utility` namespace contains utility objects and interfaces for shared services such as configuration parsing and Zenoh connectivity."
vision = "The `acs::vision` namespace contains perception objects and interfaces for camera access, floor estimation, and obstacle detection using ZED stereo data."
#
# ---------------------------------------------------------------------------
# Example:
# ---------------------------------------------------------------------------
#
# ["mynamespace/implementation/my_class"]
# __overview__    = "Does X and Y."
# __constructor__ = "Creates a my class with the given name."
# my_method       = "Performs the thing."
# "my_method.param_name" = "The value to use."

["vision/implementations/camera"]
__overview__ = "Concrete `i_camera` implementation backed by ZED SDK capture. It acquires RGB and depth frames, tracks stream health metrics, and exposes the native camera handle for lower-level integrations."
__constructor__ = "Creates a camera component that initializes and manages the ZED capture pipeline."
"__constructor__.tag" = "Unique component tag used for logging and lifecycle identification."
"__constructor__.update_rate" = "Requested update frequency in Hz for frame acquisition and status refresh."
"__constructor__.parameters" = "Camera configuration bundle (resolution, depth mode, runtime options, and related capture settings)."
update = "Polls the camera, updates color and depth frame buffers, and refreshes stream status metrics for downstream consumers."

["vision/implementations/floor_detector"]
__overview__ = "Concrete `i_floor_detector` implementation that estimates the dominant floor plane from camera data and publishes plane geometry for obstacle reasoning."
__constructor__ = "Creates a floor detector bound to a camera source and periodic update loop."
"__constructor__.tag" = "Unique component tag used for logging and lifecycle identification."
"__constructor__.update_rate" = "Requested detection frequency in Hz for floor-plane estimation."
"__constructor__.camera_ptr" = "Shared camera dependency that provides synchronized RGB/depth data used during floor extraction."
update = "Processes the latest camera data to detect and cache floor-plane geometry and detection state."

