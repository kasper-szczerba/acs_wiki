"__constructor__.update_rate" = "Requested detection frequency in Hz for obstacle analysis."
"__constructor__.parameters" = "Obstacle-detection configuration bundle (thresholds, filtering, and model-specific runtime settings)."
"__constructor__.camera_ptr" = "Shared camera dependency that provides the live RGB/depth frames used for obstacle inference."
"__constructor__.floor_detector_ptr" = "Shared floor-detector dependency used to mask floor regions and improve obstacle separation."
